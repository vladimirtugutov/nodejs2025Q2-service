version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: nest-app
    restart: always
    depends_on:
      - postgres
    ports:
      - '${APP_PORT}:${APP_PORT}'
    env_file:
      - .env
    networks:
      - app-network
    volumes:
      - .:/app
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
